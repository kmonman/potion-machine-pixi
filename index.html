<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Potion Machine</title>
<script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>

<!-- Loading spinner: plain HTML/CSS so it shows before any game script has
     run. game.js removes it once the first frame is up. -->
<style>
  #loadingSpinner {
    position: fixed; inset: 0; z-index: 99998;
    display: flex; align-items: center; justify-content: center;
    background: #0a0410;
    transition: opacity 0.3s ease;
  }
  #loadingSpinner.done { opacity: 0; pointer-events: none; }
  #loadingSpinner .ring {
    width: 56px; height: 56px; border-radius: 50%;
    border: 6px solid rgba(150, 61, 255, 0.2);
    border-top-color: #963dff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<div id="loadingSpinner"><div class="ring"></div></div>

<div id="viewport">
  <div id="gameWrap">
    <canvas id="gameCanvas" width="720" height="1280"></canvas>
    <!-- Shows the player's spooky leaderboard name (read-only — tapping it opens
         the name picker; see leaderboard.js). Not required to play. -->
    <input id="nameInput" type="text" placeholder="Tap to pick your name" readonly tabindex="-1" autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- Fullscreen (right) and mute (left) toggles — fixed to the real browser
     viewport, not gameWrap, so they stay a consistent size/position on every
     screen (Home, gameplay, Game Over) regardless of the game's own
     portrait/landscape scaling underneath, instead of each screen having its
     own separately-positioned Pixi mute button (Rob: those had drifted
     inconsistent — left on Home, right during gameplay, and invisible under
     Game Over's dark overlay, since it was really just gameplay's copy
     showing through, dimmed along with everything else). fullscreenBtn is
     still a placeholder glyph (Rob's making a real icon to swap in later);
     muteBtn already uses the game's own original unmuted/muted art
     (assets/Mute P.png / Mute P1.png — same two images every other mute
     button in the project always used), swapped by game.js's updateMuteBtn(). -->
<button id="fullscreenBtn" aria-label="Toggle fullscreen" type="button">⛶</button>
<button id="muteBtn" aria-label="Toggle mute" type="button"><img id="muteBtnImg" src="assets/Mute P.png" alt=""></button>
<!-- Manual tilt-direction flip (Rob: "all of a sudden the ball is moving
     in reverse left when it should go right and vice versa") — some
     phones/OS versions genuinely report the tilt sensor's sign backwards,
     with no reliable way to auto-detect that from here, so this lets the
     player fix it themselves and it's remembered per-device (see
     input.js's toggleInverted/Storage.getTiltInverted). Stacked above the
     mute button so it doesn't collide with it. -->
<button id="tiltInvertBtn" aria-label="Invert tilt direction" type="button">⇄</button>

<!-- PixiJS — the GPU/WebGL rendering foundation for the "pinball expansion" rebuild
     (see PINBALL_EXPANSION_PLAN.md). Loaded as a plain local file (downloaded from
     jsdelivr's pixi.js@8 build), same "no build step, just script tags" approach as
     the rest of this project — exposes a global `PIXI` object. Must load before
     every other script below, since they all use it. -->
<script src="js/vendor/pixi.min.js"></script>

<!-- Online leaderboard: Firebase (loaded from Google's CDN) + the shared
     leaderboard kit (leaderboard/ — also serves leaderboard.html, the page the
     Wix pop-ups embed). If these fail to load, js/leaderboard.js just switches
     the leaderboard off and the game plays normally. -->
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaderboard/lb-kit.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="leaderboard/lb-kit.js"></script>

<!-- Load order matters: each later file uses globals defined by the ones before it.
     Cache-busted with a timestamp query during dev (see below) so editor/browser
     caching never serves a stale file while this is actively being worked on —
     drop that before real deployment, where normal caching is a feature. -->
<script>
  const DEV_SCRIPTS = ['js/storage.js', 'js/input.js', 'js/leaderboard.js', 'js/fog.js', 'js/ui.js', 'js/platform.js', 'js/difficulty.js', 'js/physics.js', 'js/plasma_orb.js', 'js/nebula_cloud.js', 'js/plasma_storm.js', 'js/plasma_jet.js', 'js/potion_cauldron.js', 'js/pixi_home.js', 'js/pixi_levels.js', 'js/pixi_playscreen.js', 'js/pixi_hud.js', 'js/pixi_gameover.js', 'js/game.js'];
  const v = Date.now();
  document.write(DEV_SCRIPTS.map(s => `<script src="${s}?v=${v}"><\/script>`).join(''));
</script>
</body>
</html>
